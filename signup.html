<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="포인핸드 회원가입" />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link href="images/dog-solid-full.png" type="image/png" rel="icon" />
    <link href="./css/common.css" rel="stylesheet" />
    <link href="./css/login.css" rel="stylesheet" />
    <title>회원가입 | 포인핸드</title>
    <script src="js/ui.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/signup.js" defer></script>
  </head>
  <body>
    <main class="login-container">
      <h1 class="sr-only">회원가입</h1>
      <a href="index.html" class="logo">
        <img src="images/v1_4.png" alt="포인핸드 홈" />
      </a>

      <form id="signup-form">
        <input
          type="text"
          id="signup-id"
          placeholder="아이디"
          autocomplete="username"
          required
        />
        <input
          type="password"
          id="signup-pw"
          placeholder="비밀번호 (8자 이상)"
          autocomplete="new-password"
          required
        />
        <input
          type="password"
          id="signup-pw2"
          placeholder="비밀번호 확인"
          autocomplete="new-password"
          required
        />
        <button type="submit" class="btn btn--primary btn--lg btn--block">
          가입하기
        </button>
      </form>

      <nav class="links">
        <a href="login.html">이미 계정이 있으신가요? 로그인</a>
      </nav>
    </main>
    <footer class="footer_wrapper">
      <div class="footer_bottom">
        <a href="index.html"><img src="images/v1_4.png" alt="" /></a>
        <p>&copy; Pawinhand all rights reserved.</p>
      </div>
    </footer>

  </body>
</html>
