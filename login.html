<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link href="images/dog-solid-full.png" type="image/png" rel="icon" />
    <link href="./css/login.css" rel="stylesheet" />
    <link href="./css/common.css" rel="stylesheet" />
    <title>로그인 | 포인핸드</title>
  </head>
  <body>
    <!-- 메인 로그인 컨테이너 -->
    <main class="login-container">
      <a href="index.html" class="logo"
        ><img src="images/v1_4.png" alt="포인핸드 홈"
      /></a>

      <form id="login-form">
        <input
          type="text"
          id="id-input"
          placeholder="아이디"
          autocomplete="username"
          required
        />
        <input
          type="password"
          id="pw-input"
          placeholder="비밀번호"
          autocomplete="current-password"
          required
        />

        <div class="login-options">
          <label class="checkbox-group">
            <input type="checkbox" /> 로그인 상태 유지
          </label>
          <span class="ip-security">IP보안</span>
        </div>

        <button
          type="submit"
          class="btn btn--primary btn--lg btn--block login-btn"
        >
          로그인
        </button>
        <button
          type="button"
          id="demo-login-btn"
          class="btn btn--ghost btn--block"
        >
          체험 계정으로 로그인
        </button>
      </form>

      <nav class="links">
        <a href="signup.html">회원가입</a>
      </nav>
    </main>
    <section class="promotion-area">
      <article class="promotion-banner">
        <a href="#">
          <img src="images/news_1.svg" alt="포인핸드 입양 캠페인 상세 보기" />
        </a>
      </article>
    </section>

    <!-- 푸터 -->
    <footer class="footer_wrapper">
      <div class="footer_inner">
        <a href="#">이용약관</a>
        <a href="#">개인정보 처리방침</a>
        <a href="#">회원정보 고객센터</a>
      </div>

      <div class="footer_bottom">
        <a href="index.html"><img src="images/v1_4.png" alt="" /></a>
        <p>&copy; Pawinhand all rights reserved.</p>
      </div>
    </footer>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
    <script src="js/login-state.js"></script>
  </body>
</html>
