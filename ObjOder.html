<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/global.css" rel="stylesheet" />
    <link href="./css/ObjOder.css" rel="stylesheet" />
    <title>결제창 페이지</title>
  </head>
  <body>
    <header class="main-header">
      <div class="main-container">
        <ul>
          <li>
            <a href="nav-caregory"
              ><img
                src="images/category_1.svg"
                alt="카테고리"
                width="20"
                height="20"
            /></a>
          </li>
        </ul>
        <a href="ObjetB.html" class="main-logo"
          ><img src="images/Logo_1.svg" alt="" width="80" height="80"
        /></a>
        <nav>
          <ul class="main-nav">
            <li>
              <a href="#" class="nav-search"
                ><img
                  src="images/search_1.svg"
                  alt="검색"
                  width="20"
                  height="20"
              /></a>
            </li>
            <li>
              <a href="#"
                ><img src="images/cart_1.svg" alt="카트" width="20" height="20"
              /></a>
            </li>
            <li>
              <a href="#"
                ><img
                  src="images/login_1.svg"
                  alt="로그인"
                  width="20"
                  height="20"
              /></a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <!--결제 영역-->
    <main class="payment-main">
      <!-- 왼쪽 영역: 주문 및 결제 정보 입력 -->
      <div class="checkout-left">
        <!-- 1. 배송 정보 섹션 -->
        <section class="address-section">
          <h2>배송 정보</h2>
          <div class="address-container">
            <div class="address-header">
              <div class="address-user-info">
                <strong class="address-name">홍길동</strong>
                <span class="address-badge">기본 배송지</span>
              </div>
              <button type="button" class="btn-change-address">
                배송지 변경
              </button>
            </div>
            <address class="address-detail">
              <p class="road-address">경기도 수원시 어쩌구 저쩌구 303</p>
              <p class="phone-number">010-1234-1234</p>
            </address>
          </div>

          <!-- 배송 메시지 & 마케팅 수신 동의 -->
          <div class="delivery-options">
            <div class="input-group">
              <label for="delivery-message" class="sr-only"></label>
              <input
                type="text"
                id="delivery-message"
                name="message"
                placeholder="배송 메시지를 입력해주세요."
              />
            </div>
            <div class="checkbox-group">
              <input
                type="checkbox"
                id="email-alert"
                name="alert"
                value="email"
              />
              <label for="email-alert"
                >배송 알림, 이벤트 소식 이메일로 받기</label
              >
            </div>
          </div>
        </section>

        <!-- 2. 주문 상품 내역 섹션 -->
        <section class="order-section">
          <h2>주문 상품</h2>
          <div class="order-block">
            <div class="order-container">
              <div class="order-img-wrap">
                <!-- 시안의 '상품 image' 회색 박스 대용 -->
                <img src="" alt="이미지 추가예정" />
              </div>

              <!-- 상품 상세 정보 표기 영역 -->
              <div class="order-info-area">
                <h3 class="product-title">블랙 데님 와이드 스트레이트 진</h3>
                <ul class="product-options">
                  <li>색상: Black</li>
                  <li>사이즈: M</li>
                  <li>수량: 1개</li>
                </ul>
                <strong class="product-price">129,000원</strong>
                <div class="coupon-action-wrap">
                  <button type="button" class="btn-use-coupon">
                    쿠폰 사용
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 3. 보유 적립금 사용 섹션 -->
        <section class="mileage-section">
          <h2>보유 적립금 사용</h2>
          <div class="mileage-container">
            <div class="input-group">
              <input
                type="number"
                id="shop-money"
                name="used_money"
                placeholder="1111111"
              />
              <label for="shop-money" class="sr-only">적립금 입력</label>
              <button type="button" class="btn-apply-money">사용</button>
            </div>
          </div>
        </section>

        <!-- 4. 결제 수단 섹션 -->
        <section class="payment-method-section">
          <h2>결제 수단</h2>
          <div class="method-container">
            <div class="radio-group">
              <input
                type="radio"
                id="payment-toss"
                name="payment_type"
                value="toss"
              />
              <label for="payment-toss">토스페이</label>
            </div>
            <div class="radio-group">
              <input
                type="radio"
                id="payment-kakao"
                name="payment_type"
                value="kakao"
              />
              <label for="payment-kakao">카카오페이</label>
            </div>
            <div class="radio-group">
              <input
                type="radio"
                id="payment-naver"
                name="payment_type"
                value="naver"
              />
              <label for="payment-naver">네이버페이</label>
            </div>
            <div class="radio-group">
              <input
                type="radio"
                id="payment-order"
                name="payment_type"
                value="order"
              />
              <label for="payment-order">기타 결제</label>
            </div>
          </div>
          <div>
            <button>카드 무이자 할부</button>
          </div>
        </section>
        <!-- 5. 현금 영수증 섹션 -->
        <section class="cash-receipt-section">
          <h2>현금 영수증</h2>
          <div class="receipt-container">
            <!-- 번호 정보를 보여주는 박스 -->
            <div class="receipt-info">
              <span class="phone-number">010-1234-1234</span>
            </div>
            <!-- 변경을 위한 액션 버튼 -->
            <div class="receipt-action">
              <button type="button" class="btn-change-receipt">변경하기</button>
            </div>
          </div>
        </section>
      </div>

      <!-- 오른쪽 영역: 최종 결제 금액 패널 -->
      <aside class="checkout-sidebar">
        <section class="bill-section">
          <h2>결제 금액</h2>
          <ul class="bill-list">
            <li><span>상품 금액</span> <strong>129,000원</strong></li>
            <li><span>할인 금액</span> <strong>-0원</strong></li>
            <li><span>배송비</span> <strong>무료배송</strong></li>
            <li class="total-price">
              <span>총 결제 금액</span> <strong>129,000원</strong>
            </li>
          </ul>

          <div class="benefit-block">
            <h2>적립 혜택</h2>
            <div class="benefit-detail">
              <span>추가 적립 금액</span>
              <strong>1,290원</strong>
            </div>
          </div>

          <!-- 결제 동의 및 체크박스 보완 -->
          <div class="agreement-block">
            <input
              type="checkbox"
              id="payment-agree"
              name="agreement"
              required
            />
            <label for="payment-agree">
              주문내용을 확인했으며 결제에 동의합니다. 회원님의 개인정보는
              안전하게 관리합니다. ObjeB는 통신판매중개자로, 업체 배송상품 외
              상품/상품정보/거래 등에 대한 책임은 ObjeB가 아닌 판매자에게
              있습니다.
            </label>
          </div>

          <div class="submit-action">
            <button type="submit" class="btn-submit-order">결제하기</button>
          </div>
        </section>
      </aside>
    </main>
  </body>
</html>
